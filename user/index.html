<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User - Engine Fan Club</title>
    <link rel="shortcut icon" href="/assets/efcfanfinalnotext.svg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"
        integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
    <script src="https://kit.fontawesome.com/299edb3a7d.js" crossorigin="anonymous"></script>
    <script src="/scripts/parksocket.js"></script>
    <script src="/scripts/btns.js" defer></script>
    <script src="/scripts/navbar.js" defer></script>
    <script src="/scripts/theme.js"></script>
    <script src="/scripts/user.js" defer></script>
</head>

<body>

    <main class="main-profile">

        <div class="logobar">
            <img class="logo" src="/assets/efclogov2.svg" alt="">
            <h1>Engine Fan Club</h1>
        </div>

        <nav id="navbar">
            <a>home</a>
        </nav>

        <div class="spacer"></div>

        <div id="window-load">

            <div class="space-around">
                loading..
            </div>

        </div>

        <div id="window-auth" hidden>

            <p>to have a critter (and your own profile), you must have an account</p>

            <div class="pagination">
                <section style="width: fit-content;padding: 0;box-shadow: none;">
                    <header>
                        <a data-tab="tab-registerform" class="tabbtn-register" href="#register">register</a>
                        <a data-tab="tab-loginform" class="tabbtn-login" href="#login">login</a>
                    </header>
                    <div class="tabs">
                        <form class="tab" id="register">
                            <span><label for="username">username:</label>
                                <input type="text" name="username"></span><br>
                            <span><label for="password">password:</label>
                                <input type="password" name="password"></span><br>
                            <span><label for="confirmpassword">confirm password:</label>
                                <input type="password" name="confirmpassword"></span>
                            <hr>
                            <div class="space-around">
                                <button type="submit">register</button>
                            </div>
                            <p id="register-status" style="text-align: center;"></p>
                        </form>
                        <form class="tab" id="login">
                            <span><label for="username">username:</label>
                                <input type="text" name="username"></span><br>
                            <span><label for="password">password:</label>
                                <input type="password" name="password"></span><br>
                            <hr>
                            <div class="space-around">
                                <button type="submit">login</button>
                            </div>
                            <p id="login-status" style="text-align: center;"></p>
                        </form>
                    </div>
                </section>
            </div>

        </div>

        <div id="window-profile" hidden>
            <div class="profile">

                <div class="banner" id="profile-banner"></div>
                <div class="icon" id="profile-icon"></div>
                <div class="display-name" id="username">nefarkitti
                    <!--<div class="badges">
                        <div class="badge"></div>
                    </div>-->
                </div>

            </div>

            <section style="margin-top: 4px;">
                <table class="profile-stats">
                    <tr>
                        <th>joined</th>
                        <th>last online</th>
                    </tr>
                    <tr>
                        <td id="joined">17/10/2026</td>
                        <td id="lastOnline">5 hours ago</td>
                    </tr>
                </table>
                <div id="trophy-container" style="display: none;">
                    <hr>
                    <h4 id="trophy-count">trophies (0 / 10)</h4>
                    <div class="profile-grid" id="trophy-grid">
                        <!--<div class="trophy"></div>-->
                    </div>
                </div>
            </section>
            <div class="spacer" id="setting-divider"></div>
            <section class="settings" id="profile-settings">
                <button onclick="copyshare()"><i class="fa-solid fa-share-nodes"></i> share profile</button>
                <h3><u>settings</u></h3>
                <h4>icon</h4>

                <div class="profile-grid" id="profile-icons">
                    <!-- <div class="icon check"></div> -->
                </div>
                <hr>
                <h4>banner colour</h4>
                <div class="profile-grid" id="banner-cols">
                </div>
                <hr>
                <h4>critter</h4>
                <div class="critters-grid">
                    <div class="critter-preview" id="critter-preview">
                        <div id="critter-info">

                        </div>
                    </div>
                    <div class="profile-grid" id="critters">
                        <!-- <button class="critter check" style="background-image: url('/assets/sprites/cat.png');">
                        </button>
                        <button class="critter" style="background-image: url('/assets/sprites/duck.png');"></button> -->
                    </div>
                </div>
                <hr>
                <h4>account</h4>
                <button onclick="changeUsername()">change username</button>
                <button onclick="changePassword()">change password</button>
                <button onclick="logout()">log out</button>
                <h5>!!!! DANGER ZONE !!!!</h5>
                <button class="danger">delete account</button>
            </section>
        </div>

        <div class="spacer"></div>

        <footer>
            <div class="btns" id="btns">
            </div>
        </footer>

    </main>

    <script>
        // cuz im extra extra
        const userName = window.location.hash.replace("#", "");

        if (userName == "nefarkitti") {

            let element = document.createElement('link');
            element.setAttribute('rel', 'stylesheet');
            element.setAttribute('href', `/assets/themes/neffi.css`);
            document.head.appendChild(element);

        }
    </script>

</body>

</html>
