<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Fan Club</title>
    <link rel="shortcut icon" href="/assets/efcfanfinalnotext.svg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css?v=3">

    <meta name="title" content="engine fan club" />
    <meta name="description" content="a group of friends banded together to make fun video games." />
    <meta property="og:image" content="/assets/efclogov2.png">
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"
        integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1"
        crossorigin="anonymous"></script>
    <script src="/scripts/parksocket.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
    <script src="https://kit.fontawesome.com/299edb3a7d.js" crossorigin="anonymous"></script>
    <!--<script src="https://louisabraham.github.io/nekojs/neko.js" data-autostart></script>-->
    <script src="/scripts/btns.js" defer></script>
    <script src="/scripts/userprefs.js" defer></script>
    <script src="/scripts/navbar.js" defer></script>
    <script src="/scripts/theme.js"></script>
    <script src="/scripts/park.js" defer></script>
    <script src="/scripts/index.js?v=2" defer></script>
    <style>
        @font-face {
            font-family: 'Cairopixel';
            src: url('/assets/fonts/Cairopixel.ttf');
        }
    </style>
</head>

<body>
    <div class="site-border"></div>
    <!--<div id="bg-wrapper" class="bg-wrapper" style="background-image: url('/assets/template/sitebg.png');"></div>-->
    <main>

        <div class="headerbar">
            <div class="logobar">
                <img class="logo" src="/assets/efclogov2.svg" alt="">
                <h1>Engine Fan Club</h1>
            </div>

            <nav id="navbar">
                <a>home</a>
            </nav>
        </div>

        <div class="spacer"></div>

        <div class="primary-content">
            <div class="asidelist">
                <div class="wip">
                    <h2>in the back alley</h2>

                    <article class="game">
                        <a href="/games/remoria">
                            <img src="/assets/games/banners/remoria.png" alt="">
                            <div class="game-desc">
                                <h3>Remoria</h3>
                                <p>
                                    it might have a real name now
                                </p>
                            </div>
                        </a>
                    </article>
                </div>

                <div class="wip">
                    <h2>latest game article</h2>

                    <article class="game">
                        <a href="/articles/13">
                            <img src="/assets/missing.png" alt="">
                            <div class="game-desc">
                                <h3>[Gloob] Gloob v1.2 - Mobile Accessibility</h3>
                                <p>
                                    perhaps made it a bit more bearable on mobile
                                </p>
                            </div>
                        </a>
                    </article>
                </div>

                <div class="wip">
                    <h2>image of the day</h2>
                    <article class="game">
                        <img style="width: 100%;" src="/assets/site/iotd/hedgehog.png" alt="">
                        <div class="extra"><a href="/user/#fern">submitted by fern</a></div>
                    </article>
                </div>


            </div>

            <div class="articles-container">
                <div class="space-between">
                    <h2>recent articles</h2> <button class="toggle" id="gallery-toggle"
                        onclick="toggleGalleryView()">gallery
                        view</button>
                </div>
                <div class="list articles" id="article-list">
                </div>

                <div class="spacer"></div> <!--remind me to reorganise this-->

                <h2>polls</h2>
                <div id="active-poll-list">

                </div>
                <h4>past polls</h4>
                <div class="list articles" id="poll-list">
                    <!--<a href="">
                        <div class="article-content">
                            <span class="article-title">Give 1nning Moderator</span>
                            <span class="article-timestamp">2 days ago</span>
                        </div>
                    </a>-->
                </div>

            </div>

        </div>

        <div class="spacer"></div>

        <div class="canvasContainer" id="canvas-container">
            <canvas id="park" width="746" height="80" style="image-rendering: pixelated;"></canvas>
        </div>

        <div class="spacer"></div>

        <!--<h2>extra content</h2>
        <div class="list" id="extra-list">

            <a class="unav">
                <div class="article-content">
                    <span class="article-title">[Webnovel] Ratcatcher Jane & the Big Fat Rat (nefarkitti)</span>
                    <span class="article-timestamp">2026</span>
                </div>
            </a>
            <a class="unav">
                <div class="article-content">
                    <span class="article-title">[Webnovel] Detective Grand Dingbat & the Retail Ripper (1nning)</span>
                    <span class="article-timestamp">2026</span>
                </div>
            </a>

        </div>

        <div class="spacer"></div>-->

        <footer>
            <div class="btns" id="btns">
            </div>
        </footer>

    </main>

    <script src="/scripts/news.js"></script>
    <script>loadarticles(20, "articles/")</script>
</body>

</html>
