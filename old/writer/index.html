<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>writer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../style.css">
    <script src="writer.js" defer></script>
</head>

<body>

    <div class="left">
        
        <form action="">

            <label for="article-banner">Banner</label>
            <input class="update" type="text" name="article-banner" id="article-banner">

            <label for="article-title">Title</label>
            <input class="update" type="text" name="article-title" id="article-title">

            <label for="game-id">Game</label>
            <input class="update" type="text" name="game-id" id="game-id">

            <label for="article-desc">Desc</label>
            <input class="update" type="text" name="article-desc" id="article-desc">

            <label for="article-content">Content</label>
            <textarea class="update" name="article-content" id="article-content"></textarea>

            <hr>

            <button onclick="getJSON()">GET JSON</button>

        </form>

    </div>
    <div class="right" id="preview">
        <div class="news-article" style="background:url(${article.image});">
            <div class="news-container">

                <img class="news-banner" src="${article.image}" alt="">

                <div class="news-inner">

                    <span class="news-timestamp">Posted ${moment(article.timestamp).fromNow()}</span>
                    <h2>${article.title}</h2>
                    <div class="news-content">
                        ${article.content}
                    </div>

                </div>

            </div>
        </div>
    </div>

</body>

</html>
