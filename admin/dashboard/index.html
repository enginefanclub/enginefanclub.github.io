    <header>

            <img class="logo" src="/assets/efclogov2.svg" alt="">
            <h1>Engine Fan Club</h1>
        </div>
    </header>

    <main>
        <aside>
            <nav>
                <button onclick="window.location.href = '/'">homepage</button>
                <button onclick="window.location.href = '/admin/dashboard/'">users</button>
                <button>poll</button>
                <button disabled>announce</button>
                <button disabled>requests</button>
                <button disabled>logs</button>
            </nav>
        </aside>

        <div class="page-content loading" id="page">

            <div id="user-tab">
            </div>
            <div id="users-tab">
                <h5>users</h5>
                <table id="user-table">
                    <tr class="head">
                        <th>id</th>
                        <th>username</th>
                    </tr>
                </table>

                <div class="pagination" id="pagination">
                    <button onclick="prevPage()">last page</button>
                    <select name="" id="dashboard-user-pages" onchange="goToPage(this.value)">
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                    <button onclick="nextPage()">next page</button>
                </div>
            </div>

        </div>
    </main>
