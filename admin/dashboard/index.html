<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Engine Fan Club</title>
    <link rel="shortcut icon" href="/assets/efcfanfinalnotext.svg" type="image/x-icon">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"

<body>

    <main>

        <div class="logobar">
            <img class="logo" src="/assets/efclogov2.svg" alt="">
            <h1>Engine Fan Club</h1>
        </div>
        <h1>Admin Dashboard</h1>
        <div class="dashboard-user-list" id="user-list">

        </div>
        <div class="pagination" id="pagination">
            <button onclick="prevPage()">last page</button>
            <select name="" id="dashboard-user-pages" onchange="goToPage(this.value)">
                <option value="1">1</option>
                <option value="2">2</option>

            <button onclick="nextPage()">next page</button>
        </div>


    </main>

    <div class="display-profile">

        <div class="user-details">

            <div class="user-icon">
                <span class="user-icon-id"></span>
            </div>

            <div class="user-info">
                
                <h1>1nning</h1>
                <span>ID: 1</span>
                <span>Joined: 20/10/2026</span>
                <span>Icon: 26hw_bloodyefclogo</span>
                <span>Critter: 26hw_janewitch</span>
