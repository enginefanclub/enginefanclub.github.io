<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trick or Treat - Engine Fan Club</title>
    <link rel="shortcut icon" href="/assets/efcfanfinalnotext.svg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"
        integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/scripts/parksocket.js"></script>
    <script src="/scripts/btns.js" defer></script>
    <script src="/scripts/navbar.js" defer></script>
    <script src="/scripts/theme.js"></script>
</head>

<body>

    <main>

        <div class="headerbar">
            <div class="logobar">
                <img class="logo" src="/assets/efclogov2.svg" alt="">
                <h1>Engine Fan Club</h1>
            </div>

            <nav id="navbar">
                <a>home</a>
            </nav>
        </div>

        <div class="spacer"></div>

        <h2>trick or treat</h2>
        <p>
            see you next year

            <div id="leaderboard">

                

            </div>

            <script>

                let leaderboard = document.getElementById("leaderboard")

                axios.get("https://engine.nefarkitti.dev/efc-backend/leaderboard?by=candies").then(res=>{

                    if (res.data && res.data.list) {

                        let lb = res.data.list

                        leaderboard.appendChild(document.createElement("br"))

                        let sec = document.createElement("section")
                        leaderboard.appendChild(sec)

                        let table = document.createElement("table")
                        table.classList.add("lb-table")
                        sec.appendChild(table)

                        table.innerHTML += `<tr class="head">
                            <th>Place</th>
                            <th>User</th>
                            <th>Candies</th>
                        </tr>`

                        let place = 0
                        lb.forEach(person => {
                            place++
                            let newTR = document.createElement("tr")
                            newTR.innerHTML = `<td>${place}.</td> <td><a href="https://efc.nefarkitti.dev/user/#${person.username}" target="_blank">${person.username}</a></td> <td>${person.candies}</td>`
                            table.appendChild(newTR)

                        });

                    }

                })

            </script>

        </p>

        <div class="spacer"></div>

        <footer>
            <div class="btns" id="btns">
            </div>
        </footer>

    </main>

</body>

</html>
