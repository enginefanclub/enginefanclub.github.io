<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles - Engine Fan Club</title>
    <link rel="shortcut icon" href="/assets/efcfanfinalnotext.svg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
    <script src="https://kit.fontawesome.com/299edb3a7d.js" crossorigin="anonymous"></script>
    <script src="/scripts/btns.js" defer></script>
    <script src="/scripts/navbar.js" defer></script>
</head>

<body>
    <script>
        window.location.href = `${window.location.pathname}/1`
    </script>
    <main>

        <div class="logobar">
            <img class="logo" src="/assets/efclogov2.svg" alt="">
            <h1>Engine Fan Club</h1>
        </div>

        <nav id="navbar">
            <a>home</a>
        </nav>

        <div class="spacer"></div>

        <div id="webnovels-wrap">
            <h2>webnovels</h2>

            <div class="list" id="webnovels-list">
            </div>
        </div>

        <div class="reader-container" id="reader-container" style="display: none;">

            <h2 id="webnovel-title" class="space-between"></h2>

            <div class="spacer"></div>

            <div class="spine">

                <div class="page" id="reader-page">

                </div>

                <div style="width: 100%;" class="spacer"></div>
                <div class="pagination" id="pagination">
                    <button>last page</button>
                    <button class="active">1</button>
                    <button>next page</button>
                </div>

            </div>

        </div>


        <div class="spacer"></div>

        <footer>
            <div class="btns" id="btns">
            </div>
        </footer>

    </main>
</body>
</html>
