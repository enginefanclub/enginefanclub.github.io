<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles - Engine Fan Club</title>
    <link rel="shortcut icon" href="/assets/efcfanfinalnotext.svg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
    <script src="https://kit.fontawesome.com/299edb3a7d.js" crossorigin="anonymous"></script>
    <script src="/scripts/btns.js" defer></script>
    <script src="/scripts/navbar.js" defer></script>
    <script src="/scripts/reader.js" defer></script>
    <script src="/scripts/theme.js"></script>
</head>

<body>

    <main>

        <div class="logobar">
            <img class="logo" src="/assets/efclogov2.svg" alt="">
            <h1>Engine Fan Club</h1>
        </div>

        <nav id="navbar">
            <a>home</a>
        </nav>

        <div class="spacer"></div>

        <div class="reader-container" id="reader-container">

            <h2 id="webnovel-title" class="space-between">
                {{{title}}}
                <div class="flex-right reader-buttons">
                    <button onclick="saveBookmark(`{{id}}`, {{page}})">save</button>
                    <button onclick="loadBookmark(`{{id}}`, {{page}})">load</button>
                </div>
            </h2>

            <div class="spacer"></div>

            <div class="spine">

                <div class="page" id="reader-page">
                    {{{data}}}
                </div>

                <div style="width: 100%;" class="spacer"></div>
                <div class="pagination" id="pagination">
                    {{{PAGINATION}}}
                </div>

            </div>

        </div>


        <div class="spacer"></div>

        <footer>
            <div class="btns" id="btns">
            </div>
        </footer>

    </main>

</body>

</html>
