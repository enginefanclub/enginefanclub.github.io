<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Engine Fan Club</title>
    <link rel="shortcut icon" href="/assets/efcfanfinalnotext.svg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"
        integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1"
        crossorigin="anonymous"></script>
    <script src="/scripts/parksocket.js"></script>
    <script src="/scripts/btns.js" defer></script>
    <script src="/scripts/navbar.js" defer></script>
    <script src="/scripts/theme.js"></script>
    <script src="/scripts/settings.js" defer></script>
</head>

<body>
    <!--I see you, Pleb.-->
    <main>

        <div class="headerbar">
            <div class="logobar">
                <img class="logo" src="/assets/efclogov2.svg" alt="">
                <h1>Engine Fan Club</h1>
            </div>

            <nav id="navbar">
                <a>home</a>
            </nav>
        </div>

        <div class="spacer"></div>

        <h2>site settings</h2>
        <div class="settings">
            <section>
                <div>
                    <label for="theme">site theme:</label>
                    <select name="theme" id="theme-select">
                        <option value="default">default</option>
                        <option value="halloween">halloween</option>
                        <option value="dorfic">dorfic</option>
                        <option value="faero">f. aero</option>
                        <!---->
                    </select>
                </div>
                <span class="extra">'default' will display seasonal themes as normal</span><br>
            </section>
        </div>

        <div class="spacer"></div>

        <footer>
            <div class="btns" id="btns">
            </div>
        </footer>

    </main>

</body>

</html>
